name: Build Mango

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Build application
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean Mango.spec
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes
      - name: Create installer
        shell: pwsh
        run: |
          $version = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { '1.0.2' }
          iscc "/DMyAppVersion=$version" packaging\windows\Mango.iss
      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: Mango-Windows-Installer
          path: dist/installer/Mango-Setup-*.exe
          if-no-files-found: error

  build-linux:
    name: Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-linux.txt
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libegl1 libgl1 libglib2.0-0 libnss3 libxkbcommon-x11-0
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-linux.txt pyinstaller
      - name: Verify Qt WebEngine binding
        run: python -c "from qtpy.QtWebEngineWidgets import QWebEngineScript; print(QWebEngineScript)"
      - name: Build application
        run: python -m PyInstaller --noconfirm --clean mango_linux.spec
      - name: Assemble AppImage directory
        run: |
          mkdir -p AppDir/usr/lib/mango AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp -a dist/Mango/. AppDir/usr/lib/mango/
          cp packaging/appimage/AppRun AppDir/AppRun
          cp packaging/appimage/mango.desktop AppDir/mango.desktop
          cp img/icon.png AppDir/mango.png
          cp img/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/mango.png
          chmod +x AppDir/AppRun
      - name: Build AppImage
        run: |
          curl --fail --location --retry 3 \
            --output appimagetool-x86_64.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool-x86_64.AppImage AppDir Mango-x86_64.AppImage
      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v6
        with:
          name: Mango-Linux-AppImage
          path: Mango-x86_64.AppImage
          if-no-files-found: error
